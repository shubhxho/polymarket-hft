[package]
name = "polymarket-hft"
version = "0.4.0"
edition = "2024"
build = "build.rs"

[features]
mlx = ["dep:mlx-rs", "mlx-rs/metal"]
mlx-cpu = ["dep:mlx-rs"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
mlx-rs = { version = "=0.32.0", default-features = false, features = ["accelerate"], optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "=0.10.9"

[[bin]]
name = "hft"
path = "src/main.rs"

[[bin]]
name = "hft-bench"
path = "src/bin/bench.rs"
