[package]
name = "polymarket-hft"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[features]
mlx = ["dep:mlx-rs"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
mlx-rs = { version = "=0.32.0", optional = true }

[[bin]]
name = "hft"
path = "src/main.rs"

[[bin]]
name = "hft-bench"
path = "src/bin/bench.rs"
