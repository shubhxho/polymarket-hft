[project]
name = "polymarket-hft"
version = "0.1.0"
description = "Weather-signal HFT for Polymarket with TypeSafe Jev on the semantic path"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.0",
  "orjson>=3.10",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "typesafe-sdk>=0.5.7",
  "polymarket-client>=0.8",
  "websockets>=13",
  "uvloop>=0.21; sys_platform != 'win32'",
  "editables>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
hft = "hft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hft"]
dev-mode-exact = true



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
