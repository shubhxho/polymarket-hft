<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Cached lookup versus local reference implementations</title><desc id="desc">Median amortized nanoseconds per lookup over five rounds on identical synthetic books. Logarithmic bars. Lower is faster. Not a competitor engine benchmark.</desc><rect width="1000" height="410" fill="#0b1220"/><g font-family="monospace" fill="#e5e7eb"><text x="24" y="30" font-size="18">Book-top lookup: measured local references</text><text x="24" y="54" font-size="13">Log scale | lower is faster | five rounds | identical outputs</text><text x="24" y="88" font-size="13">1 levels: cached</text><rect x="250" y="77" width="64.3" height="14" fill="#34d399"/><text x="324.26500500649433" y="88" font-size="13">2.52 ns/lookup</text><text x="24" y="114" font-size="13">1 levels: full_scan</text><rect x="250" y="103" width="409.0" height="14" fill="#38bdf8"/><text x="669.0449587025375" y="114" font-size="13">360.19 ns/lookup</text><text x="24" y="140" font-size="13">1 levels: btree</text><rect x="250" y="129" width="57.2" height="14" fill="#38bdf8"/><text x="317.2481432111263" y="140" font-size="13">2.28 ns/lookup</text><text x="24" y="186" font-size="13">16 levels: cached</text><rect x="250" y="175" width="62.0" height="14" fill="#34d399"/><text x="322.0224083251561" y="186" font-size="13">2.44 ns/lookup</text><text x="24" y="212" font-size="13">16 levels: full_scan</text><rect x="250" y="201" width="409.3" height="14" fill="#38bdf8"/><text x="669.280056451506" y="212" font-size="13">361.41 ns/lookup</text><text x="24" y="238" font-size="13">16 levels: btree</text><rect x="250" y="227" width="68.6" height="14" fill="#38bdf8"/><text x="328.6452379504721" y="238" font-size="13">2.69 ns/lookup</text><text x="24" y="284" font-size="13">128 levels: cached</text><rect x="250" y="273" width="62.0" height="14" fill="#34d399"/><text x="322.0224083251561" y="284" font-size="13">2.44 ns/lookup</text><text x="24" y="310" font-size="13">128 levels: full_scan</text><rect x="250" y="299" width="409.2" height="14" fill="#38bdf8"/><text x="669.1857367500671" y="310" font-size="13">360.92 ns/lookup</text><text x="24" y="336" font-size="13">128 levels: btree</text><rect x="250" y="325" width="70.7" height="14" fill="#38bdf8"/><text x="330.6869267804671" y="336" font-size="13">2.77 ns/lookup</text></g></svg>
