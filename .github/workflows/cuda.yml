name: Blacksmith CUDA compile gate
on:
  push:
    paths: ['cuda/**', 'scripts/build-cuda.sh', '.github/workflows/cuda.yml']
  pull_request:
    paths: ['cuda/**', 'scripts/build-cuda.sh', '.github/workflows/cuda.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuda-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Load exact source archive without a checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL --max-time 120 --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Compile native kernels without claiming device parity
        shell: bash
        run: |
          sh scripts/test-cuda-host.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66 \
            nvcc -O3 --fmad=false -arch=sm_80 -std=c++17 cuda/packed.cu -o /tmp/hft-cuda
