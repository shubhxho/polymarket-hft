[workspace]
members = ["rust"]
resolver = "3"

[patch.crates-io]
# The upstream wrapper otherwise enables mlx-sys/metal even in CPU-only builds.
mlx-rs = { path = "vendor/mlx-rs" }

[profile.dev]
debug = 0
opt-level = 1
incremental = false

[profile.test]
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1

# Smaller correctness builds on disk-constrained hosts. Not a performance profile.
[profile.compact]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false
codegen-units = 16
